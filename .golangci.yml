run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
  goimports:
    local-prefixes: github.com/pmady/otel-gpu-receiver

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
